# =============================================================================
#   Trickster Automation Studio packet overlay  (PACKETS_NEO)
# =============================================================================
#
#   Loaded AFTER packets_db.yml: an entry with the same Dir + Id replaces the
#   keys it sets (Name / Fields / Note / Handler), the rest is inherited.
#   Only VERIFIED knowledge goes here (memory kto-* notes, client RE, the
#   ProjectPAULA handlers). Source says where each entry came from.
#
#   Fields  - 'type name' items, in wire order (name optional):
#     u8 u16 u32 u64 i8 i16 i32 i64 f32
#     str        NUL-terminated (CP949)     strN   fixed N bytes, NUL-padded
#     blobN      N raw bytes                equipset234 = blob234
#     tuple      (u32,u16,u8)               rest   every remaining byte
#     N*{a,b}    loop, N = the previous integer field
#     5*{a,b}    loop, fixed count          rest*{a,b}  loop to the end
#
#   C2S entries below the S2C block are generated from ProjectPAULA's
#   game_session.cpp dispatch + the linear pkt.read<T>() sequence of each
#   handler (branchy handlers keep only the name; their reads are in Note).
# =============================================================================

Header:
  Type: PACKETS_NEO
  Version: 1

