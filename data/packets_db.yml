# =============================================================================
#   Packets Database  (PACKETS_DB)
# =============================================================================
#
#   Trickster network packets (S2C + C2S) reverse-engineered from Trickster.bin.
#   S2C field lists come from the named pkt_read_* readers in each handler; C2S
#   opcodes from decompiled Net_Send_*/c2s_send(OPCODE,..) calls (ground truth),
#   C2S field lists from builder heap-writes (approximate).
#
#   Transport: 11-byte header + payload (+opt pad). Header: u16 Len, u16, u16
#   (opcode/param), u8 RandByte@6, u8 Flags@7 (1=checksum 4=encrypt 8=pad), u8
#   Checksum@8. Payload cipher: CryptTable[b + ((RandByte ^ pos) << 8)] over a
#   65536-byte (256x256) substitution table (dump *g_crypt_table @0x10FA928).
#
#   Fields
#     Id       - opcode (decimal)
#     Hex      - opcode (hex)
#     Dir      - S2C | C2S
#     Name     - known semantic name (kto_opcodes.md; omitted if unknown)
#     Handler  - client handler (S2C) / sender function (C2S)
#     Len      - fixed | var
#     Fields   - ordered field types; 'N*{...}' = loop (N = preceding count field)
#     Note     - verified field semantics (where known)
#     InDoc    - (C2S) false = opcode newly discovered, absent from kto_opcodes.md
#
#   Field types: u8 u16 u32 str(nul-terminated) blobN(N raw bytes)
#   equipset234(234B equip/avatar layer) tuple(u32,u16,u8).
# =============================================================================

